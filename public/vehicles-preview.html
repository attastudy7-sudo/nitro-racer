<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Vehicles preview</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;background:radial-gradient(ellipse at 50% 0,#1c2540,#0a0d18 70%);color:#dfe6f5;font:14px/1.3 system-ui,Segoe UI,sans-serif;padding:20px}
  h1{margin:0 0 14px;font-size:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
  .card{background:#12172a;border:1px solid #232b48;border-radius:14px;padding:12px}
  .card h2{margin:0;font-size:15px}.card p{margin:2px 0 8px;color:#8d9abd;font-size:12px}
  .row{display:flex;gap:8px}
  .veh{position:relative;flex:1;aspect-ratio:2.4;background:linear-gradient(#1a2038,#0e1224 78%,#2a2f45 78.5%,#171a2a);border-radius:8px;overflow:hidden}
  .veh>svg{position:absolute;inset:0;width:100%;height:100%}
  .veh .w{position:absolute;animation:spin .5s linear infinite}
  .veh .w svg{width:100%;height:100%;display:block}
  .hov{animation:bob 1.6s ease-in-out infinite}
  .big .veh{aspect-ratio:2.4}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes bob{50%{transform:translateY(-3%)}}
</style></head><body>
<h1>Vehicle garage preview</h1>
<div class="grid" id="g"></div>
<script src="vehicles.js"></script>
<script>
  var g=document.getElementById('g');if(/big/.test(location.search))g.style.gridTemplateColumns='1fr';
  VEHICLES.forEach(function(v,vi){
    var card=document.createElement('div');card.className='card';
    var html='<h2>'+(vi+1)+'. '+v.name+' <small style="color:#6f7ca3;font-weight:400">'+v.price+' coins, lvl '+v.level+'</small></h2><p>'+v.tagline+'</p><div class="row">';
    for(var j=0;j<3;j++){
      var pt=PAINTS[(vi+j*4)%PAINTS.length];
      html+='<div class="veh" title="'+pt.name+'"><div class="'+(v.hover?'hov':'')+'" style="position:absolute;inset:0">'+v.body(pt.paint,pt.accent)+
        v.wheels.map(function(w){var d=w.r*2;return '<div class="w" style="left:'+((w.x-w.r)/240*100)+'%;top:'+((w.y-w.r)/100*100)+'%;width:'+(d/240*100)+'%;height:'+(d)+'%">'+VehicleArt.wheelSVG(w.r)+'</div>'}).join('')+
        '</div></div>';
    }
    card.innerHTML=html+'</div>';
    g.appendChild(card);
  });
  // body svgs fill the .veh via CSS
  document.querySelectorAll('.veh>div>svg').forEach(function(s){s.style.cssText='position:absolute;inset:0;width:100%;height:100%'});
</script></body></html>
